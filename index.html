<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>高中英语词根记忆法</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f5f7;
  --card-bg:rgba(255,255,255,0.7);
  --card-border:rgba(255,255,255,0.8);
  --accent:#0071e3;
  --accent-hover:#0077ed;
  --text:#1d1d1f;
  --text-secondary:#86868b;
  --text-tertiary:#aeaeb2;
  --glass:rgba(255,255,255,0.6);
  --shadow:0 4px 20px rgba(0,0,0,0.04);
  --shadow-hover:0 8px 40px rgba(0,0,0,0.08);
  --radius:16px;
  --nav-height:56px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1d1d1f;
    --card-bg:rgba(44,44,46,0.7);
    --card-border:rgba(72,72,74,0.8);
    --accent:#2997ff;
    --accent-hover:#40a9ff;
    --text:#f5f5f7;
    --text-secondary:#86868b;
    --text-tertiary:#636366;
    --glass:rgba(44,44,46,0.5);
    --shadow:0 4px 20px rgba(0,0,0,0.2);
    --shadow-hover:0 8px 40px rgba(0,0,0,0.3);
  }
}
html{font-size:16px;-webkit-font-smoothing:antialiased}
body{
  font-family:'Inter','Noto Sans SC',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  transition:background 0.3s,color 0.3s;
}
nav{
  position:fixed;top:0;left:0;right:0;height:var(--nav-height);
  background:rgba(245,245,247,0.8);backdrop-filter:blur(40px) saturate(150%);
  -webkit-backdrop-filter:blur(40px) saturate(150%);
  border-bottom:1px solid rgba(0,0,0,0.06);z-index:100;
  display:flex;align-items:center;padding:0 24px;
}
@media(prefers-color-scheme:dark){
  nav{background:rgba(29,29,31,0.8);border-bottom:1px solid rgba(255,255,255,0.06);}
}
nav .logo{font-size:14px;font-weight:700;letter-spacing:-0.2px;color:var(--text);display:flex;align-items:center;gap:8px;}
nav .logo span{font-size:18px;}
nav .nav-links{display:flex;gap:24px;margin-left:auto;align-items:center;}
nav .nav-links a{font-size:12px;color:var(--text-secondary);text-decoration:none;font-weight:500;transition:color 0.2s;cursor:pointer;}
nav .nav-links a:hover{color:var(--accent);}
main{padding-top:calc(var(--nav-height) + 40px);padding-bottom:80px;}
/* Hero区 */
.hero{
  text-align:center;padding:60px 24px 40px;
  background:linear-gradient(180deg,var(--bg) 0%,transparent 100%);
}
.hero .badge{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:0.5px;
  padding:4px 12px;border-radius:20px;
  background:var(--accent);color:#fff;margin-bottom:16px;
}
.hero h1{font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:12px;}
.hero h1 span{background:linear-gradient(135deg,#0071e3,#40a9ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero p{font-size:18px;color:var(--text-secondary);max-width:560px;margin:0 auto;line-height:1.6;font-weight:400;}
.stats-bar{
  display:flex;justify-content:center;gap:48px;margin-top:32px;
}
.stats-bar .stat{text-align:center;}
.stats-bar .stat .num{font-size:28px;font-weight:800;letter-spacing:-0.5px;background:linear-gradient(135deg,#0071e3,#40a9ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.stats-bar .stat .label{font-size:12px;color:var(--text-tertiary);font-weight:500;margin-top:2px;}
.section{padding:0 24px;max-width:960px;margin:0 auto;}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.section-header h2{font-size:22px;font-weight:700;letter-spacing:-0.3px;}
.section-header .count{font-size:13px;color:var(--text-tertiary);font-weight:500;}
.root-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;
}
.root-card{
  background:var(--card-bg);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--card-border);
  border-radius:var(--radius);padding:16px;
  cursor:pointer;transition:all 0.25s cubic-bezier(0.25,0.1,0.25,1);
  box-shadow:var(--shadow);
}
.root-card:hover{
  transform:translateY(-2px) scale(1.02);
  box-shadow:var(--shadow-hover);
  border-color:var(--accent);
}
.root-card .emoji{font-size:28px;margin-bottom:6px;display:block;}
.root-card .root{font-size:16px;font-weight:700;letter-spacing:-0.2px;margin-bottom:2px;}
.root-card .meaning{font-size:12px;color:var(--text-secondary);font-weight:400;}
.root-card .word-count{font-size:11px;color:var(--text-tertiary);margin-top:6px;font-weight:500;}
/* 单词详情面板 - 无TTS，纯音标展示 */
.detail-panel{
  position:fixed;top:var(--nav-height);right:0;bottom:0;width:420px;
  background:var(--card-bg);backdrop-filter:blur(40px) saturate(150%);
  -webkit-backdrop-filter:blur(40px) saturate(150%);
  border-left:1px solid rgba(0,0,0,0.06);
  transform:translateX(100%);transition:transform 0.4s cubic-bezier(0.25,0.1,0.25,1);
  z-index:50;overflow-y:auto;padding:24px;
}
@media(prefers-color-scheme:dark){
  .detail-panel{border-left:1px solid rgba(255,255,255,0.06);}
}
.detail-panel.open{transform:translateX(0);}
.detail-panel .close{
  position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;
  border:none;background:rgba(0,0,0,0.05);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;color:var(--text-secondary);
  transition:all 0.2s;
}
.detail-panel .close:hover{background:rgba(0,0,0,0.1);}
.detail-panel .panel-header{margin-bottom:20px;}
.detail-panel .panel-header .emoji{font-size:36px;display:block;margin-bottom:8px;}
.detail-panel .panel-header .root-name{font-size:24px;font-weight:800;letter-spacing:-0.5px;}
.detail-panel .panel-header .root-meaning{font-size:14px;color:var(--text-secondary);margin-top:4px;}
.word-list{display:flex;flex-direction:column;gap:8px;}
.word-item{
  background:rgba(255,255,255,0.5);border-radius:12px;padding:12px 14px;
  transition:all 0.2s;cursor:pointer;position:relative;
}
@media(prefers-color-scheme:dark){
  .word-item{background:rgba(255,255,255,0.04);}
}
.word-item:hover{background:rgba(0,113,227,0.06);}
.word-item .word{font-size:15px;font-weight:600;letter-spacing:-0.2px;}
.word-item .phonetic{
  font-size:12px;color:var(--text-tertiary);margin-left:8px;font-weight:400;
  font-family:'Inter','SF Pro','Menlo',monospace;letter-spacing:0.3px;
}
/* 音节拆分 - 替代TTS读音 */
.word-item .syllables{
  display:inline-block;font-size:11px;color:var(--text-tertiary);
  margin-left:6px;font-weight:500;opacity:0.7;
  font-family:'Inter','SF Pro','Menlo',monospace;
}
.word-item .meaning{font-size:13px;color:var(--text-secondary);margin-top:2px;}
.word-item .example{font-size:12px;color:var(--text-tertiary);margin-top:4px;font-style:italic;padding-left:8px;border-left:2px solid var(--accent);}
/* 音标展开区 - 替换原来的播放按钮 */
.word-item .phonetic-toggle{
  position:absolute;top:10px;right:10px;
  font-size:16px;cursor:pointer;opacity:0.4;
  transition:all 0.2s;user-select:none;
  background:none;border:none;padding:4px;border-radius:6px;
  line-height:1;
}
.word-item .phonetic-toggle:hover{opacity:1;background:rgba(0,113,227,0.08);transform:scale(1.1);}
.word-item .phonetic-detail{
  display:none;margin-top:6px;padding:6px 10px;
  background:rgba(0,113,227,0.04);border-radius:8px;
  font-size:12px;color:var(--text-secondary);line-height:1.6;
  font-family:'Inter','SF Pro','Menlo',monospace;
}
.word-item .phonetic-detail.show{display:block;}
.word-item .phonetic-detail .ipa{font-size:14px;font-weight:500;color:var(--accent);}
.word-item .phonetic-detail .stress-guide{font-size:11px;color:var(--text-tertiary);margin-top:2px;}

.freq-badge{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;margin-left:6px;}
.freq-high{background:rgba(255,69,58,0.1);color:#ff453a;}
.freq-mid{background:rgba(255,159,10,0.1);color:#ff9f0a;}
.freq-low{background:rgba(52,199,89,0.1);color:#34c759;}

/* 思维导图 */
.mindmap-section{
  max-width:960px;margin:40px auto;padding:0 24px;
}
.mindmap-section h2{font-size:22px;font-weight:700;letter-spacing:-0.3px;margin-bottom:16px;}
.mindmap-container{
  background:var(--card-bg);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border:1px solid var(--card-border);border-radius:var(--radius);
  padding:24px;box-shadow:var(--shadow);overflow:hidden;
}
#mindmap-svg{width:100%;height:400px;}

/* 搜索 */
.search-box{
  max-width:480px;margin:0 auto 32px;position:relative;
}
.search-box input{
  width:100%;padding:12px 16px 12px 44px;border-radius:12px;
  border:1px solid rgba(0,0,0,0.06);background:var(--card-bg);
  backdrop-filter:blur(20px);font-size:16px;font-family:inherit;-webkit-appearance:none;
  color:var(--text);outline:none;transition:all 0.2s;
}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,0.15);}
.search-box input::placeholder{color:var(--text-tertiary);}
.search-box .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;color:var(--text-tertiary);}

/* 底部 */
footer{
  text-align:center;padding:40px 24px;color:var(--text-tertiary);font-size:12px;
}
footer a{color:var(--accent);text-decoration:none;}

/* 遮罩 */
.overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.2);
  backdrop-filter:blur(4px);z-index:49;display:none;
}
.overlay.show{display:block;}

.empty-state{text-align:center;padding:40px;color:var(--text-tertiary);}
.empty-state .icon{font-size:48px;margin-bottom:12px;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.1);border-radius:4px;}
@media(prefers-color-scheme:dark){
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);}
}

@media(max-width:768px){
  .hero h1{font-size:32px;}
  .hero p{font-size:15px;}
  .stats-bar{gap:24px;flex-wrap:wrap;}
  .stats-bar .stat .num{font-size:22px;}
  .root-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  .detail-panel{width:100%;}
  nav .nav-links{display:none;}
}

/* 搜索结果高亮 */
.highlight {
  background: linear-gradient(120deg, rgba(0,113,227,0.2) 0%, rgba(0,113,227,0.2) 100%);
  border-radius: 3px;
  padding: 0 2px;
  font-weight: 600;
  color: var(--accent);
}
.root-card .highlight {
  background: rgba(0,113,227,0.15);
}
</style>
</head>
<body>
<nav>
  <div class="logo"><span>📚</span> 词根记忆法</div>
  <div class="nav-links">
    <a onclick="scrollToSection('roots')">词根</a>
    <a onclick="scrollToSection('mindmap')">思维导图</a>
    <a onclick="toggleDark()">🌓</a>
  </div>
</nav>

<main>
  <div class="hero">
    <div class="badge">📖 高中英语词根记忆法</div>
    <h1>词有<span>根</span>，<br>记有<span>方</span></h1>
    <p>基于词根联想记忆法，将高中词汇重组为词根体系。理解一个词根，掌握一群单词。</p>
    <div class="stats-bar" id="stats-bar">
      <div class="stat"><div class="num" id="root-count-num">0</div><div class="label">词根</div></div>
      <div class="stat"><div class="num" id="word-count-num">0</div><div class="label">词汇</div></div>
    </div>
  </div>

  <div class="search-box">
    <span class="icon">🔍</span>
    <input type="text" id="search-input" placeholder="搜索单词或词根..." oninput="searchWords(this.value)">
  </div>

  <div class="section" id="roots">
    <div class="section-header">
      <h2>📦 词根</h2>
      <span class="count" id="root-count">共 0 个词根</span>
    </div>
    <div class="root-grid" id="root-grid"></div>
  </div>

  <div class="mindmap-section" id="mindmap">
    <h2>🧠 词根思维导图</h2>
    <div class="mindmap-container">
      <svg id="mindmap-svg"></svg>
    </div>
  </div>
</main>

<div class="overlay" id="overlay" onclick="closePanel()"></div>

<div class="detail-panel" id="detail-panel">
  <button class="close" onclick="closePanel()">✕</button>
  <div class="panel-header" id="panel-header"></div>
  <div class="word-list" id="word-list"></div>
</div>

<footer>
  高中英语词根记忆法 · 基于教育部高中英语课程标准 · <a href="https://github.com/wangdwn/ieso-vocab" target="_blank">GitHub</a>
</footer>

<script>
// ===== 数据加载 =====
let vocabData = null;
let currentRoot = null;

async function loadData() {
  try {
    const resp = await fetch('./vocab-data.json');
    vocabData = await resp.json();
    init();
  } catch(e) {
    document.getElementById('root-grid').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div>数据加载失败，请检查 vocab-data.json 是否存在</div>';
  }
}

function init() {
  const roots = vocabData.roots;
  const rootKeys = Object.keys(roots);
  
  let totalWords = 0;
  rootKeys.forEach(k => totalWords += roots[k].words.length);
  
  document.getElementById('root-count-num').textContent = rootKeys.length;
  document.getElementById('word-count-num').textContent = totalWords;
  document.getElementById('root-count').textContent = '共 ' + rootKeys.length + ' 个词根';
  
  // 渲染词根网格
  const grid = document.getElementById('root-grid');
  const emojis = ['📦','🔤','📖','🎯','🧩','💡','🔗','🌱','⚡','🎓','📝','🔄','🌟','🔑','💎','📌','🎨','🧠','📊','🎵'];
  grid.innerHTML = rootKeys.map((key, i) => {
    const root = roots[key];
    return '<div class="root-card" onclick="showRoot(\''+key+'\')">' +
      '<span class="emoji">'+emojis[i%emojis.length]+'</span>' +
      '<div class="root">'+key+'</div>' +
      '<div class="meaning">'+root.meaning+'</div>' +
      '<div class="word-count">'+root.words.length+' 个单词</div></div>';
  }).join('');
  
  renderMindmap(rootKeys, roots);
}

// ===== 显示词根详情（无TTS，音标展示） =====
function showRoot(key) {
  const root = vocabData.roots[key];
  if(!root) return;
  currentRoot = key;
  
  document.getElementById('panel-header').innerHTML =
    '<span class="emoji">🔤</span>' +
    '<div class="root-name">'+key+'</div>' +
    '<div class="root-meaning">'+root.meaning+'</div>' +
    '<button class="study-start-btn" onclick="event.stopPropagation();enterStudyMode(\''+key+'\')">🎯 开始学习</button>';
  
  const freqMap = {high:'高频', mid:'中频', low:'低频'};
  document.getElementById('word-list').innerHTML = root.words.map((w, idx) => {
    // 生成音节拆分（规则：按音标中的元音分组）
    const syl = getSyllables(w.word, w.phonetic);
    return '<div class="word-item" onclick="togglePhonetic('+idx+')">' +
      '<button class="phonetic-toggle" onclick="event.stopPropagation();togglePhonetic('+idx+')">📢</button>' +
      '<div><span class="word">'+w.word+'</span>' +
      '<span class="phonetic">'+w.phonetic+'</span>' +
      (syl ? '<span class="syllables">·'+syl+'·</span>' : '') +
      '<span class="freq-badge freq-'+w.freq+'">'+freqMap[w.freq]+'</span></div>' +
      '<div class="meaning">'+w.meaning+'</div>' +
      (w.example ? '<div class="example">'+w.example+'</div>' : '') +
      '<div class="phonetic-detail" id="pd-'+idx+'">' +
        '<div class="ipa">/'+w.phonetic.replace(/[\/]/g,'')+'/</div>' +
        '<div class="stress-guide">'+getStressGuide(w.phonetic)+'</div>' +
      '</div>' +
    '</div>';
  }).join('');
  
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

// ===== 音标展开/折叠（替代TTS播放） =====
function togglePhonetic(idx) {
  const el = document.getElementById('pd-'+idx);
  if(el) el.classList.toggle('show');
}

// ===== 音节拆分（简单规则） =====
function getSyllables(word, phonetic) {
  if(!word || !phonetic) return '';
  // 按元音音标分组近似
  const vowels = word.match(/[aeiouy]+/gi);
  if(!vowels || vowels.length <= 1) return '';
  // 简单规则：从辅音处拆分
  return word.toLowerCase().replace(/([^aeiouy]+)(?=[aeiouy])/g, '$1·').replace(/^·|·$/g,'');
}

// ===== 重音提示 =====
function getStressGuide(phonetic) {
  if(!phonetic) return '';
  if(phonetic.includes('ˈ')) return '🔴 主重音在此音节，读得最重最长';
  if(phonetic.includes('ˌ')) return '🟠 次重音在此音节';
  return '⚪ 无特别重音，自然发音即可';
}

// ===== 搜索 =====
function searchWords(query) {
  if(!vocabData || !query.trim()) {
    const roots = vocabData.roots;
    const rootKeys = Object.keys(roots);
    const grid = document.getElementById('root-grid');
    const emojis = ['📦','🔤','📖','🎯','🧩','💡','🔗','🌱','⚡','🎓','📝','🔄','🌟','🔑','💎','📌','🎨','🧠','📊','🎵'];
    grid.innerHTML = rootKeys.map((key, i) => {
      const root = roots[key];
      return '<div class="root-card" onclick="showRoot(\''+key+'\')">' +
        '<span class="emoji">'+emojis[i%emojis.length]+'</span>' +
        '<div class="root">'+key+'</div>' +
        '<div class="meaning">'+root.meaning+'</div>' +
        '<div class="word-count">'+root.words.length+' 个单词</div></div>';
    }).join('');
    return;
  }
  
  const q = query.toLowerCase();
  const roots = vocabData.roots;
  const matched = {};
  
  Object.keys(roots).forEach(key => {
    const root = roots[key];
    if(key.toLowerCase().includes(q) || root.meaning.includes(q)) {
      matched[key] = root;
      return;
    }
    const words = root.words.filter(w => 
      w.word.toLowerCase().includes(q) || w.meaning.includes(q)
    );
    if(words.length > 0) {
      matched[key] = {...root, words};
    }
  });
  
  const keys = Object.keys(matched);
  const grid = document.getElementById('root-grid');
  const emojis = ['📦','🔤','📖','🎯','🧩','💡','🔗','🌱','⚡','🎓','📝','🔄','🌟','🔑','💎','📌','🎨','🧠','📊','🎵'];
  
  if(keys.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div>没有找到匹配的单词或词根</div>';
    return;
  }
  
  grid.innerHTML = keys.map((key, i) => {
    const root = matched[key];
    return '<div class="root-card" onclick="showRoot(\''+key+'\')"' +
      (root.words.length>0 && root.words!==vocabData.roots[key]?.words ? ' style="border-color:var(--accent)"' : '') + '>' +
      '<span class="emoji">'+emojis[i%emojis.length]+'</span>' +
      '<div class="root">'+key+'</div>' +
      '<div class="meaning">'+root.meaning+'</div>' +
      '<div class="word-count">'+root.words.length+' 个单词</div></div>';
  }).join('');
}

// ===== 思维导图 =====
function renderMindmap(keys, roots) {
  const svg = document.getElementById('mindmap-svg');
  const w = svg.clientWidth || 800;
  const h = 400;
  const cx = w/2, cy = h/2;
  const r = Math.min(w,h)/2 - 60;
  
  let html = `<defs>
    <linearGradient id="mg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0071e3;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#40a9ff;stop-opacity:0.05"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="${w}" height="${h}" fill="url(#mg)" rx="12"/>
  <text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="13" font-weight="600" fill="#86868b" font-family="Inter,sans-serif">词根体系</text>
  <text x="${cx}" y="${cy+12}" text-anchor="middle" font-size="10" fill="#aeaeb2" font-family="Inter,sans-serif">${keys.length} roots · 点击查看详情</text>`;
  
  const shown = keys.slice(0, 24);
  shown.forEach((key, i) => {
    const angle = (i / shown.length) * 2 * Math.PI - Math.PI/2;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    const root = roots[key];
    const wordCount = root.words.length;
    
    html += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(0,113,227,0.08)" stroke-width="1.5"/>`;
    
    const size = Math.min(12 + wordCount, 22);
    const fontSize = Math.min(11, size * 0.5);
    
    html += `<circle cx="${x}" cy="${y}" r="${size}" fill="rgba(0,113,227,0.08)" stroke="rgba(0,113,227,0.2)" stroke-width="1" cursor="pointer"
      onclick="showRoot('${key}')"
      onmouseover="this.setAttribute('fill','rgba(0,113,227,0.2)')"
      onmouseout="this.setAttribute('fill','rgba(0,113,227,0.08)')"/>`;
    
    html += `<text x="${x}" y="${y+3}" text-anchor="middle" font-size="${fontSize}" font-weight="600" fill="#0071e3" font-family="Inter,sans-serif" pointer-events="none">${key}</text>`;
  });
  
  svg.innerHTML = html;
}

function scrollToSection(id) {
  document.getElementById(id).scrollIntoView({behavior:'smooth'});
}

function toggleDark() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
}

// ===== 启动 =====
loadData();

// ===== 增强功能：卡片学习+进度+收藏（直接内联，不走外部加载） =====
// localStorage 工具
const DB = {
  get(k,d) { try{let v=JSON.parse(localStorage.getItem('vocab_'+k));return v||d}catch{return d} },
  set(k,v) { localStorage.setItem('vocab_'+k,JSON.stringify(v)) },
  getToday() {
    const d=new Date().toDateString(), data=this.get('days',{});
    if(!data[d]) data[d]={learned:[],quizzed:[],correct:0,wrong:0,streak:0};
    return data[d];
  },
  saveToday(t) {
    const d=new Date().toDateString(), data=this.get('days',{});
    data[d]=t; data[d].streak=this.calcStreak(data);
    this.set('days',data); this.set('streak',data[d].streak);
  },
  calcStreak(data) {
    let s=0,d=new Date();
    while(true){let k=d.toDateString();if(data[k]&&data[k].learned.length>=5){s++;d.setDate(d.getDate()-1)}else break}
    return s;
  },
  getFavorites() {return this.get('favs',[])},
  toggleFavorite(w){let f=this.getFavorites();f.includes(w)?f.splice(f.indexOf(w),1):f.push(w);this.set('favs',f);return f},
  isFavorite(w){return this.getFavorites().includes(w)}
};

let studyWords=[], studyIndex=0, studyFlipped=false;

function shuffleArray(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function showFavorites() {
  const favs=DB.getFavorites(), roots=vocabData.roots;
  let fw=[];
  Object.keys(roots).forEach(k=>{roots[k].words.forEach(w=>{if(favs.includes(w.word))fw.push({...w,root:k,rootMeaning:roots[k].meaning})})});
  document.getElementById('panel-header').innerHTML='<span class="emoji">⭐</span><div class="root-name">我的收藏</div><div class="root-meaning">共 '+fw.length+' 个单词</div>';
  if(fw.length===0) document.getElementById('word-list').innerHTML='<div class="empty-state"><div class="icon">⭐</div>还没有收藏单词<br>在卡片学习中点击 ☆ 收藏</div>';
  else document.getElementById('word-list').innerHTML=fw.map(w=>'<div class="word-item"><div><span class="word">'+w.word+'</span><span class="phonetic">'+(w.phonetic||'')+'</span></div><div class="meaning">'+w.meaning+' <span style="font-size:11px;color:var(--text-tertiary);">· '+w.root+': '+w.rootMeaning+'</span></div></div>').join('');
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function showProgress() {
  const days=DB.get('days',{}), streak=DB.get('streak',0), favs=DB.getFavorites(), today=DB.getToday();
  const totalLearned=Object.values(days).reduce((s,d)=>s+(d.learned?.length||0),0);
  let wd=[];
  for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let k=d.toDateString(),day=days[k];wd.push({label:d.toLocaleDateString('zh-CN',{weekday:'short'}),count:day?.learned?.length||0,active:!!day})}
  document.getElementById('panel-header').innerHTML='<span class="emoji">📊</span><div class="root-name">学习进度</div><div class="root-meaning">🔥 连续打卡 '+streak+' 天</div>';
  document.getElementById('word-list').innerHTML='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;"><div class="stat-card"><div class="stat-num">'+totalLearned+'</div><div class="stat-label">累计学习</div></div><div class="stat-card"><div class="stat-num">'+favs.length+'</div><div class="stat-label">收藏单词</div></div><div class="stat-card"><div class="stat-num">'+Object.keys(days).length+'</div><div class="stat-label">学习天数</div></div><div class="stat-card"><div class="stat-num">'+streak+'</div><div class="stat-label">最长连击</div></div></div><div style="font-size:13px;font-weight:600;margin-bottom:8px;">本周打卡</div><div style="display:flex;gap:8px;justify-content:space-between;">'+wd.map(d=>'<div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:'+(d.active?'var(--accent)':'rgba(0,0,0,0.05)')+';color:'+(d.active?'#fff':'var(--text-tertiary)')+';font-size:12px;font-weight:600;">'+(d.count>0?d.count:(d.active?'✓':''))+'</div><span style="font-size:10px;color:var(--text-tertiary);">'+d.label+'</span></div>').join('')+'</div>'+(streak>=3?'<div style="margin-top:16px;padding:12px;background:rgba(255,159,10,0.1);border-radius:12px;font-size:13px;color:#ff9f0a;text-align:center;">🔥 已连续打卡 '+streak+' 天，继续保持！</div>':'');
  document.getElementById('detail-panel').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}

function enterStudyMode(key) {
  const root=vocabData.roots[key];
  if(!root||!root.words||root.words.length===0)return;
  studyWords=shuffleArray([...root.words]); studyIndex=0; studyFlipped=false;
  const overlay=document.getElementById('overlay'), panel=document.getElementById('detail-panel');
  overlay.classList.add('show'); panel.classList.remove('open');
  let se=document.getElementById('study-panel');
  if(!se){se=document.createElement('div');se.id='study-panel';document.body.appendChild(se)}
  se.classList.add('open');
  renderCard(key);
}

function renderCard(key) {
  const se=document.getElementById('study-panel');
  if(!se||studyWords.length===0)return;
  const w=studyWords[studyIndex], total=studyWords.length, pct=((studyIndex+1)/total*100).toFixed(0);
  const today=DB.getToday(), isFav=DB.isFavorite(w.word);
  if(!today.learned.includes(w.word)){today.learned.push(w.word);DB.saveToday(today)}
  const freqMap={high:'高频',mid:'中频',low:'低频'};
  se.innerHTML='<div class="study-header"><div class="study-header-left"><button class="study-btn" onclick="document.getElementById(\'study-panel\').classList.remove(\'open\');document.getElementById(\'overlay\').classList.remove(\'show\')">← 返回</button><span class="study-title">📖 '+key+'</span></div><div class="study-header-right"><span class="study-progress-text">'+(studyIndex+1)+'/'+total+'</span><span class="study-streak">🔥 '+(today.streak||DB.get('streak',0))+'天</span></div></div><div class="study-progress-bar"><div class="study-progress-fill" style="width:'+pct+'%"></div></div><div class="study-card" onclick="studyFlipped=!studyFlipped;renderCard(\''+key+'\')"><div class="study-card-inner '+(studyFlipped?'flipped':'')+'"><div class="study-card-front"><div class="study-word">'+w.word+'</div>'+(w.phonetic?'<div class="study-phonetic">'+w.phonetic+'</div>':'')+'<div class="study-tap-hint">👆 点击翻转</div></div><div class="study-card-back"><div class="study-word">'+w.word+'</div><div class="study-phonetic">'+(w.phonetic||'')+'</div><div class="study-meaning">'+w.meaning+'</div>'+(w.example?'<div class="study-example">'+w.example+'</div>':'')+'<div class="study-freq-tag">'+(freqMap[w.freq]||'中频')+'</div></div></div></div><div class="study-actions"><button class="study-btn study-btn-fav '+(isFav?'active':'')+'" onclick="event.stopPropagation();DB.toggleFavorite(\''+w.word+'\');renderCard(\''+key+'\')">'+(isFav?'⭐':'☆')+' 收藏</button><div class="study-nav">'+(studyIndex>0?'<button class="study-btn study-btn-nav" onclick="event.stopPropagation();studyIndex--;studyFlipped=false;renderCard(\''+key+'\')">← 上一个</button>':'')+'<button class="study-btn study-btn-primary" onclick="event.stopPropagation();nextCard(\''+key+'\')">知道了 →</button></div></div>';
}

function nextCard(key) {
  if(studyIndex<studyWords.length-1){studyIndex++;studyFlipped=false;renderCard(key)}
  else {
    const today=DB.getToday();today.correct+=studyWords.length;DB.saveToday(today);
    const se=document.getElementById('study-panel');
    se.innerHTML='<div class="study-header"><div class="study-header-left"><button class="study-btn" onclick="document.getElementById(\'study-panel\').classList.remove(\'open\');document.getElementById(\'overlay\').classList.remove(\'show\')">← 返回</button><span class="study-title">🎉 完成！</span></div></div><div class="study-complete"><div class="study-complete-icon">🎉</div><div class="study-complete-title">'+key+' 学习完成！</div><div class="study-complete-stats"><span>📚 学习了 '+studyWords.length+' 个单词</span><span>🔥 连续打卡 '+(today.streak||DB.get('streak',0))+' 天</span></div><button class="study-btn study-btn-primary" onclick="document.getElementById(\'study-panel\').classList.remove(\'open\');document.getElementById(\'overlay\').classList.remove(\'show\')">返回词根</button></div>';
  }
}

// 导航栏加按钮
(function(){
  const checkInit=setInterval(function(){
    const nav=document.querySelector('.nav-links');
    if(nav&&window.vocabData){
      clearInterval(checkInit);
      // 加收藏和进度按钮（在🌓之前）
